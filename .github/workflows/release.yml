name: Update appcast on release

# Fires when you publish a GitHub Release that has the signed/notarized DMG
# attached. The workflow downloads that DMG, signs it with Sparkle's EdDSA
# private key, and prepends a new <item> to docs/appcast.xml so every Clippy
# user sees the update on their next check.
#
# You handle all Apple signing + notarization locally. The only secret this
# workflow needs is SPARKLE_PRIVATE_KEY.

on:
  release:
    types: [published]
  # Manual re-run. A failed run can only be retried from the Actions UI with
  # the workflow file as it was at the time — which is no help when the
  # workflow itself is what broke. This lets a fixed workflow be pointed at
  # a release that already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish the appcast for, e.g. v1.0.17"
        required: true

jobs:
  appcast:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      # Check out main (not the tag) so pushing the appcast commit is a
      # fast-forward. We still reference the tag via github.event.release.tag_name
      # for the version metadata.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version from release tag
        id: meta
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          # Strip leading v/V so "v1.0.5" and "V1.0.5" both yield "1.0.5".
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download update asset from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Sparkle supports both .dmg and .zip. Grab whichever is attached;
          # prefer .dmg if both exist (better UX on install). Fails clearly
          # if neither is present.
          ASSET_NAME=$(gh release view "${{ steps.meta.outputs.tag }}" \
            --json assets \
            --jq '[.assets[] | select(.name | test("\\.dmg$|\\.zip$"))]
                  | sort_by(if (.name | endswith(".dmg")) then 0 else 1 end)
                  | .[0].name')
          if [ -z "$ASSET_NAME" ] || [ "$ASSET_NAME" = "null" ]; then
            echo "::error::No .dmg or .zip asset found on release ${{ steps.meta.outputs.tag }}"
            exit 1
          fi
          echo "Found asset: $ASSET_NAME"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          gh release download "${{ steps.meta.outputs.tag }}" --pattern "$ASSET_NAME" --clobber

      - name: Verify the asset really is this version
        # v1.0.17 went out with a 1.0.16 build inside it. The release, the
        # signature and the appcast were all correct — they just described
        # the wrong app. Anyone who took the update installed 1.0.16, was
        # offered 1.0.17 again, and looped.
        #
        # Nothing checked, because nothing compared the tag to the bundle.
        # This does, and fails the release rather than publishing a loop.
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.meta.outputs.version }}"
          WORK=$(mktemp -d)

          case "$ASSET_NAME" in
            *.dmg)
              MOUNT="$WORK/mnt"
              mkdir -p "$MOUNT"
              hdiutil attach "$ASSET_NAME" -nobrowse -readonly -mountpoint "$MOUNT" > /dev/null
              APP=$(find "$MOUNT" -maxdepth 1 -name "*.app" | head -n 1)
              ;;
            *.zip)
              ditto -x -k "$ASSET_NAME" "$WORK"
              APP=$(find "$WORK" -maxdepth 2 -name "*.app" | head -n 1)
              ;;
          esac

          if [ -z "${APP:-}" ]; then
            echo "::error::No .app found inside $ASSET_NAME"
            exit 1
          fi

          FOUND=$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")
          BUILD=$(plutil -extract CFBundleVersion raw "$APP/Contents/Info.plist")
          echo "Tag says $EXPECTED · bundle says $FOUND (build $BUILD)"

          case "$ASSET_NAME" in
            *.dmg) hdiutil detach "$MOUNT" -quiet || true ;;
          esac

          if [ "$FOUND" != "$EXPECTED" ]; then
            echo "::error::$ASSET_NAME contains Clippy $FOUND, but the release is tagged $EXPECTED. Rebuild and re-upload the asset."
            exit 1
          fi

      - name: Install Sparkle CLI (for sign_update)
        # Straight from Sparkle's own release, not Homebrew. The `sparkle`
        # cask was disabled on 2026-09-01 for failing Homebrew's Gatekeeper
        # check, which broke every release from that day on — the release and
        # its assets went up fine, but the appcast was never updated, so
        # nobody was offered the update. Pinned, so a change upstream can't
        # break publishing again without us choosing it.
        env:
          SPARKLE_VERSION: "2.9.6"
        run: |
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p sparkle-tools
          tar -xJf sparkle.tar.xz -C sparkle-tools
          SPARKLE_BIN="$PWD/sparkle-tools/bin/sign_update"
          if [ ! -x "$SPARKLE_BIN" ]; then
            echo "::error::sign_update not found in the Sparkle archive"
            exit 1
          fi
          echo "SPARKLE_BIN=$SPARKLE_BIN" >> "$GITHUB_ENV"

      - name: Sign the asset with EdDSA
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" | base64 --decode > sparkle_private
          SIGNED=$("$SPARKLE_BIN" "$ASSET_NAME" -f sparkle_private)
          rm sparkle_private

          echo "Sparkle output: $SIGNED"
          SIGNATURE=$(echo "$SIGNED" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          LENGTH=$(echo "$SIGNED" | sed -n 's/.*length="\([^"]*\)".*/\1/p')

          if [ -z "$SIGNATURE" ] || [ -z "$LENGTH" ]; then
            echo "::error::Failed to parse Sparkle signature/length"
            exit 1
          fi

          echo "SPARKLE_SIGNATURE=$SIGNATURE" >> "$GITHUB_ENV"
          echo "SPARKLE_LENGTH=$LENGTH" >> "$GITHUB_ENV"

      - name: Update appcast.xml
        run: ./scripts/update-appcast.sh "${{ steps.meta.outputs.version }}" "$SPARKLE_SIGNATURE" "$SPARKLE_LENGTH" "$ASSET_NAME"

      - name: Commit appcast changes to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Save our updated appcast somewhere safe BEFORE switching branches,
          # otherwise the checkout would overwrite it with main's version.
          cp docs/appcast.xml /tmp/appcast.xml.new

          # Move to main regardless of whatever ref was initially checked out
          # (tag, detached HEAD, something else). This is the core fix: we
          # build the commit on top of the real main branch so the push is
          # always a fast-forward.
          git fetch origin main
          git checkout -B main origin/main

          # Restore our updated appcast and commit it.
          cp /tmp/appcast.xml.new docs/appcast.xml
          git add docs/appcast.xml
          if git diff --cached --quiet; then
            echo "No appcast changes to commit."
            exit 0
          fi
          git commit -m "chore: update appcast for ${{ steps.meta.outputs.tag }}"

          # Retry in case someone pushed to main between fetch and push.
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "✓ appcast pushed"
              exit 0
            fi
            echo "Push rejected (attempt $attempt). Rebasing on latest main..."
            git pull --rebase origin main
          done

          echo "::error::Could not push appcast update after 3 attempts"
          exit 1
